name: create-package-branches

# One branch per package, rebuilt from main on every push.
#
# abapGit imports a whole repository - there is no sparse checkout - so without
# this a system that wants src/01 has to take the on-premise packages with it
# and gets activation errors for technology it never asked for. Each generated
# branch carries one package, the overview app and nothing else, so the abapGit
# branch dropdown becomes the place where you pick your feature.
#
# The branch list, the release each package is checked at and the shared
# directories it needs live in .github/packages.json - adding a package is one
# entry there, not a change here.
#
# Every branch is verified before it is pushed: abaplint at the release that
# package declares, which is what keeps the "Runs on" column of the README
# honest and what catches a package that has quietly grown a dependency on one
# of the other eight. On a pull request the whole thing runs except the push,
# so a change that would break a branch fails while it can still be fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # newest main wins - a superseded run would publish older content
  group: create-package-branches
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.read.outputs.branches }}
    steps:
    - uses: actions/checkout@v7
    - id: read
      run: echo "branches=$(jq -c '[.[].branch]' .github/packages.json)" >> "$GITHUB_OUTPUT"

  branch:
    needs: packages
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.packages.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci

    - name: Reduce the tree to one package
      run: node .github/scripts/build-package-branch.mjs ${{ matrix.branch }}

    # the package alone, at the release it says it needs
    - run: npx abaplint ./abaplint.jsonc
    - run: node .github/scripts/check-overview.mjs

    - name: Commit and push
      if: github.event_name != 'pull_request' && github.repository == 'abap2UI5/samples-ext'
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git diff --staged --quiet || git commit -q -m "Generated from main ${GITHUB_SHA:0:7} - ${{ matrix.branch }} only"
        git push --force origin HEAD:${{ matrix.branch }}
