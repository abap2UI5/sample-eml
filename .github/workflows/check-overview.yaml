name: check-overview

# The overview app z2ui5_cl_smps_app_000 names every sample as a string and
# resolves it at runtime, so that it survives a package the system cannot
# activate and a checkout carrying only part of this repository. The compiler
# therefore no longer notices a renamed or a newly added sample - this check
# does. Plain node, no dependencies, so it stays a few seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-overview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-overview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node .github/scripts/check-overview.mjs
