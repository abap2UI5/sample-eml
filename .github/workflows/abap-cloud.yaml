name: abap-cloud

# Syntax check against the ABAP Cloud language version. There is nothing to
# strip beforehand - unlike the samples repository this one ships a single set
# of sources and no cloud branch is generated from it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: abap-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx abaplint .github/abaplint/abap_cloud.jsonc
