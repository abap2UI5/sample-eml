name: abap-standard

# Syntax check against the on-premise release. Unlike the samples repository
# there is no abap-702 counterpart: EML requires ABAP Platform >= 1909, so
# this repository is not downported (see abaplint.jsonc).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: abap-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx abaplint ./abaplint.jsonc
